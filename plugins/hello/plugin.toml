id = "hello"
name = "Hello"
version = "0.1.0"
description = "Sample plugin: inserts today's date and counts words in the active file."
authors = ["OpenIDEA contributors"]
change-notes = """
0.1.0 — first release: Insert Date and Word Count of Active File commands.
"""
openidea-api = "0.1"
wasm = "dist/plugin.wasm"
permissions = ["project-read", "editor-read", "editor-write"]

# Static declarations make the commands visible before the plugin activates;
# the plugin may also register more at runtime via `register-command`.
[[contributes.commands]]
id = "insert-date"
title = "Hello: Insert Date"
category = "Hello"

[[contributes.commands]]
id = "word-count"
title = "Hello: Word Count of Active File"
category = "Hello"
