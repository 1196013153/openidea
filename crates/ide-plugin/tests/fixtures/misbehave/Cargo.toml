[package]
name = "openidea-plugin-misbehave"
version = "0.1.0"
edition = "2024"
publish = false

# Test fixture for ide-plugin: built by `plugins/build.sh <this dir>`, checked in as dist/plugin.wasm.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
