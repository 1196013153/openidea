id = "scss"
name = "SCSS"
extensions = ["scss"]
line-comment = "//"
block-comment = ["/*", "*/"]
indent = { tab-size = 2, insert-spaces = true }
ui-mode = "SCSS"

[[language-servers]]
name = "vscode-css-language-server"
command = "vscode-css-language-server"
args = ["--stdio"]
initialization-options = { provideFormatter = true }
install-hint = "npm i -g vscode-langservers-extracted"
