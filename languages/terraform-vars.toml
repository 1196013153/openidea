id = "terraform-vars"
name = "Terraform Variables"
extensions = ["tfvars"]
line-comment = "#"
block-comment = ["/*", "*/"]
indent = { tab-size = 2, insert-spaces = true }
tree-sitter = "hcl"

[[language-servers]]
name = "terraform-ls"
command = "terraform-ls"
args = ["serve"]
root-markers = [".terraform", ".terraform.lock.hcl"]
install-hint = "brew install hashicorp/tap/terraform-ls"
