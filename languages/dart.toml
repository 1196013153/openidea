id = "dart"
name = "Dart"
extensions = ["dart"]
line-comment = "//"
block-comment = ["/*", "*/"]
indent = { tab-size = 2, insert-spaces = true }
ui-mode = "Dart"
tree-sitter = "dart"

[[language-servers]]
name = "dart"
command = "dart"
args = ["language-server", "--protocol=lsp"]
root-markers = ["pubspec.yaml", "analysis_options.yaml"]
install-hint = "Install the Dart SDK (https://dart.dev/get-dart) or Flutter"

[debugger]
adapter = "dart"
command = "dart"
args = ["debug_adapter"]
install-hint = "Install the Dart SDK (https://dart.dev/get-dart); use `flutter debug_adapter` for Flutter apps"
